<style>
  html, body { height: 100%; margin: 0; }
  body { background: #f6faf7; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; color: #111827; }
  .header { background: #1a2332; padding: 14px 20px; display: flex; align-items: center; gap: 10px; }
  .back-arrow { display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex-shrink: 0; color: #c8d0dc; text-decoration: none; transition: color 0.15s ease; }
  .back-arrow:hover { color: #e8ecf1; }
  .header img { height: 28px; width: 28px; }
  .header .wordmark { font-size: 20px; font-weight: 600; letter-spacing: 0.02em; color: #e8ecf1; }
  .header .tagline { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.14em; color: #8a94a6; }
  .body { max-width: 900px; margin: 0 auto; padding: 20px; }
  .card { background: #fff; border: 1.5px solid #2A8B53; border-radius: 12px; margin-bottom: 16px; }
  .card-head { background: #1a2332; padding: 9px 16px; font-size: 11px; font-weight: 600; color: #c8d0dc; text-transform: uppercase; letter-spacing: 0.05em; border-radius: 10.5px 10.5px 0 0; }
  .hidden { display: none; }
  .card-body { padding: 18px; }
  input { width: 100%; padding: 9px 12px; border-radius: 7px; border: none; background: #eaf6ef; font-size: 13px; box-sizing: border-box; font-family: inherit; }
  .btn { padding: 9px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; background: #2A8B53; color: #fff; font-family: inherit; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .col-head { font-size: 11px; font-weight: 700; color: #4b5563; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
  .col-count { font-size: 10.5px; color: #9ca3af; margin-bottom: 8px; }
  .col-scroll { max-height: 220px; overflow-y: auto; border: 1px solid #e5eae7; border-radius: 8px; padding: 4px 10px; }
  .row { padding: 7px 0; border-bottom: 1px solid #eef2ee; font-size: 12.5px; }
  .row:last-child { border-bottom: none; }
  .row .name { font-weight: 500; }
  .row .email { color: #6b7280; font-size: 11.5px; }
  .row .roles { color: #9ca3af; font-size: 10.5px; margin-top: 1px; }
  .empty-note { font-size: 12px; color: #9ca3af; padding: 6px 0; }
  .search-result-row { padding: 9px 12px; cursor: pointer; border-bottom: 1px solid #e5eae7; }
  .search-result-row:last-child { border-bottom: none; }
  .alert { padding: 10px 13px; border-radius: 8px; font-size: 12.5px; margin-bottom: 14px; }
  .alert-warn { background: #fff8e8; color: #8a5d09; border: 1px solid #f0c94a; }
  .alert-error { background: #fdf1ec; color: #b3543a; border: 1px solid #f3a898; }
  .spinner { width: 13px; height: 13px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; display: inline-block; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

      <div class="tagline">Bulk Onboarding</div>
    </div>
  </div>

  <div class="body">
    <div class="card">
      <div class="card-head">Company</div>
      <div class="card-body">
        <div style="display:flex; gap:8px; position:relative;">
          <div style="flex:1; position:relative;">
            <input id="companyInput" placeholder="Paste a HubSpot company URL/ID, or type a company name" oninput="onCompanySearchInput()" autocomplete="off" />
            <div id="companySearchResults" class="hidden" style="position:absolute; top:calc(100% + 4px); left:0; right:0; background:#ffffff; border:1px solid #cbd5cf; border-radius:8px; max-height:260px; overflow-y:auto; z-index:20; box-shadow:0 8px 24px rgba(20,23,31,0.15);"></div>
          </div>
          <button class="btn" id="pullBtn" onclick="pullContacts()" style="white-space:nowrap;">Pull contacts →</button>
        </div>
      </div>
    </div>

    <div id="resultArea"></div>
  </div>

<script>
  var searchDebounceTimer = null;
  var lastCompanySearchQuery = "";
  var lastCompanySearchResults = [];
  // Set when a company is picked from the autocomplete dropdown, so the
  // input box can display the company's real NAME for readability while
  // the actual pull still uses its true ID underneath. Typing anything
  // after a selection invalidates this (see onCompanySearchInput below),
  // since the displayed text no longer reliably corresponds to it.
  var selectedCompanyId = null;

  function looksLikeCompanyUrlOrId(s) {
    return s.indexOf("hubspot.com") >= 0 || /^\d+$/.test(s);
  }

  function matchesRefinedCompanyQuery(result, query) {
    var hay = (result.name + " " + result.domain).toLowerCase();
    var words = query.toLowerCase().split(/\s+/).filter(function(w) { return w.length > 0; });
    return words.every(function(w) { return hay.indexOf(w) >= 0; });
  }

  function onCompanySearchInput() {
    selectedCompanyId = null;
    var val = document.getElementById("companyInput").value.trim();
    if (searchDebounceTimer) clearTimeout(searchDebounceTimer);

    if (!val || val.length < 2 || looksLikeCompanyUrlOrId(val)) {
      hideCompanySearchResults();
      return;
    }

    if (lastCompanySearchQuery && lastCompanySearchResults.length < 10 &&
        val.toLowerCase().indexOf(lastCompanySearchQuery.toLowerCase()) === 0) {
      var filtered = lastCompanySearchResults.filter(function(r) { return matchesRefinedCompanyQuery(r, val); });
      showCompanySearchResults(filtered);
      return;
    }

    searchDebounceTimer = setTimeout(function() {
      google.script.run
        .withSuccessHandler(function(results) {
          lastCompanySearchQuery = val;
          lastCompanySearchResults = results || [];
          showCompanySearchResults(results);
        })
        .withFailureHandler(function() { hideCompanySearchResults(); })
        .rene_searchCompaniesByName(val);
    }, 250);
  }

  function showCompanySearchResults(results) {
    var box = document.getElementById("companySearchResults");
    if (!results || !results.length) {
      box.innerHTML = '<div style="padding:10px 12px; font-size:12px; color:#6b7280;">No matches found.</div>';
      box.classList.remove("hidden");
      return;
    }

    box.innerHTML = results.map(function(r) {
      var sub = [r.domain, r.location].filter(function(x) { return x; }).join(" · ");
      return '<div class="search-result-row" data-id="' + r.id + '" ' +
        'onmousedown="selectCompanySearchResult(\'' + r.id + '\')">' +
        '<div style="font-size:13px; color:#111827;">' + escapeHtml(r.name) + '</div>' +
        (sub ? '<div style="font-size:11px; color:#6b7280; margin-top:1px;">' + escapeHtml(sub) + '</div>' : '') +
        '</div>';
    }).join("");

    box.querySelectorAll(".search-result-row").forEach(function(row) {
      row.addEventListener("mouseenter", function() { row.style.background = "#f6faf7"; });
      row.addEventListener("mouseleave", function() { row.style.background = "transparent"; });
    });

    box.classList.remove("hidden");
  }

  function hideCompanySearchResults() {
    var box = document.getElementById("companySearchResults");
    box.classList.add("hidden");
    box.innerHTML = "";
  }

  function selectCompanySearchResult(companyId) {
    // Look up the matching result (still held in lastCompanySearchResults
    // at this point) to get its real name for display — rather than
    // threading the name through the row's onmousedown attribute, which
    // would break for any company name containing a quote or apostrophe
    // (e.g. "O'Brien Realty").
    var match = lastCompanySearchResults.filter(function(r) { return String(r.id) === String(companyId); })[0];
    document.getElementById("companyInput").value = match ? match.name : companyId;
    selectedCompanyId = companyId;
    lastCompanySearchQuery = "";
    lastCompanySearchResults = [];
    hideCompanySearchResults();
    pullContacts();
  }

  document.addEventListener("click", function(e) {
    var box = document.getElementById("companySearchResults");
    var input = document.getElementById("companyInput");
    if (box && !box.contains(e.target) && e.target !== input) {
      hideCompanySearchResults();
    }
  });

  function pullContacts() {
    var input = document.getElementById("companyInput").value.trim();
    var btn = document.getElementById("pullBtn");
    var resultArea = document.getElementById("resultArea");
    if (!input) {
      resultArea.innerHTML = '<div class="alert alert-warn">Paste a company URL or ID first.</div>';
      return;
    }

    // If a company was just picked from the dropdown, the input box shows
    // its NAME (for readability) — but the actual pull needs the real ID,
    // captured separately at selection time rather than re-parsed from
    // the display text (which wouldn't match any URL/ID pattern at all).
    var idToUse = selectedCompanyId || input;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Pulling…';
    resultArea.innerHTML = "";

    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false;
        btn.textContent = "Pull contacts →";
        renderResult(res);
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.textContent = "Pull contacts →";
        resultArea.innerHTML = '<div class="alert alert-error">⚠ ' + (err.message || err) + '</div>';
      })
      .rene_pullCompanyContacts(idToUse);
  }

  function renderResult(res) {
    var resultArea = document.getElementById("resultArea");
    if (!res || !res.ok) {
      resultArea.innerHTML = '<div class="alert alert-error">⚠ ' + ((res && res.error) || "Something went wrong.") + '</div>';
      return;
    }

    // Whatever the box shows right now (a raw ID pasted directly, or one
    // passed through from Landing's search dropdown) gets replaced with
    // the real company name once it's actually known — the same reason
    // selectCompanySearchResult() already does this for RENE's own
    // internal dropdown, just applied here too so EVERY successful pull
    // ends with the friendly name showing, regardless of how the person
    // arrived at it.
    if (res.companyName) {
      document.getElementById("companyInput").value = res.companyName;
    }

    if (res.needsDealSelection) {
      renderDealPicker(res);
      return;
    }

    var html = "";
    if (res.warning) {
      html += '<div class="alert alert-warn">⚠ ' + res.warning + '</div>';
    }

    // Nothing to show beyond the warning itself (e.g. no OSBO deal found,
    // or the deal has zero contacts) — skip the empty grid entirely.
    if (res.totalContacts === 0) {
      resultArea.innerHTML = html;
      return;
    }

    var headerText = escapeHtml(res.companyName);
    if (res.dealName) headerText += ' — ' + escapeHtml(res.dealName);
    headerText += ' — ' + res.totalContacts + ' contact(s)';

    html += '<div class="card"><div class="card-head" style="display:flex; align-items:center; justify-content:space-between; gap:12px;">' +
      '<span>' + headerText + '</span>';
    if (res.dealId) {
      html += '<a href="https://app-na2.hubspot.com/contacts/21242237/record/0-3/' + encodeURIComponent(res.dealId) + '" target="_blank" ' +
        'style="color:#c8d0dc; font-size:11px; font-weight:600; text-transform:none; letter-spacing:normal; text-decoration:none; white-space:nowrap; border:1px solid rgba(255,255,255,0.25); padding:4px 10px; border-radius:6px;">View in HubSpot →</a>';
    }
    html += '</div><div class="card-body">';
    html += '<div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">';
    html += renderColumn("Brokers", res.groups.broker);
    html += renderColumn("Admin / Transaction Coordinator", res.groups.admin);
    html += renderColumn("Partner / Owner", res.groups.partner);
    html += renderColumn("Unlabeled / Unknown", res.groups.unknown);
    html += '</div></div></div>';

    resultArea.innerHTML = html;
  }

  // Shown when a company has more than one OSBO-pipeline deal — lets the
  // person pick which one to pull contacts from, rather than RENE
  // guessing or silently merging both together.
  function renderDealPicker(res) {
    var resultArea = document.getElementById("resultArea");
    resultArea.innerHTML =
      '<div class="alert alert-warn">⚠ This company has more than one OSBO Pipeline deal — pick which one to pull contacts from:</div>' +
      '<div class="card"><div class="card-head">' + escapeHtml(res.companyName) + '</div>' +
      '<div class="card-body" id="dealPickerBody"></div></div>';

    var body = document.getElementById("dealPickerBody");
    res.deals.forEach(function(d) {
      var row = document.createElement("div");
      row.className = "search-result-row";
      row.style.cursor = "pointer";
      row.innerHTML = '<div style="font-size:13px; color:#111827; font-weight:500;">' + escapeHtml(d.name) + '</div>';
      // Closures over d and res.companyName here — deliberately NOT built
      // as an inline onclick string, since company/deal names can contain
      // quotes or apostrophes (e.g. "O'Brien Realty") that would break a
      // concatenated attribute string.
      row.addEventListener("click", function() {
        pullDealContacts(d.id, res.companyName, d.name);
      });
      row.addEventListener("mouseenter", function() { row.style.background = "#f6faf7"; });
      row.addEventListener("mouseleave", function() { row.style.background = "transparent"; });
      body.appendChild(row);
    });
  }

  function pullDealContacts(dealId, companyName, dealName) {
    var resultArea = document.getElementById("resultArea");
    resultArea.innerHTML = '<div class="alert alert-warn">Pulling contacts for "' + escapeHtml(dealName) + '"…</div>';

    google.script.run
      .withSuccessHandler(function(res) { renderResult(res); })
      .withFailureHandler(function(err) {
        resultArea.innerHTML = '<div class="alert alert-error">⚠ ' + (err.message || err) + '</div>';
      })
      .rene_pullDealContacts(dealId, companyName, dealName);
  }

  function renderColumn(title, list) {
    var out = '<div><div class="col-head">' + title + '</div><div class="col-count">' + list.length + ' found</div><div class="col-scroll">';
    if (!list.length) {
      out += '<div class="empty-note">None found.</div>';
    } else {
      list.forEach(function(c) {
        out += '<div class="row"><div class="name">' + escapeHtml(c.name) + '</div>' +
          '<div class="email">' + escapeHtml(c.email) + '</div>' +
          (c.roles.length ? '<div class="roles">' + escapeHtml(c.roles.join(", ")) + '</div>' : '') +
          '</div>';
      });
    }
    out += '</div></div>';
    return out;
  }

  function escapeHtml(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  // Auto-run: when the shared Landing page's RENE box is used directly
  // (paste a company there, hit Pull contacts), it navigates here with
  // that value already in the URL rather than making the person retype
  // it — this fills the company box and starts the pull immediately on
  // load, same as if they'd typed it and clicked Pull contacts themselves.
  var initialQuery = <?!= (typeof initialQuery !== 'undefined' && initialQuery) ? JSON.stringify(initialQuery) : '""' ?>;
  if (initialQuery) {
    document.getElementById("companyInput").value = initialQuery;
    pullContacts();
  }
</script>

</body>
</html>
